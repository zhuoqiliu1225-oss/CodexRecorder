name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Unit tests (no models or credentials)
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check web/panel.js
          node --check web/i18n.js
          node --check web/pcm-worklet.js
          node --check scripts/control.cjs
          node tests/test_panel.cjs
          node tests/test_i18n.cjs
          node --check tests/live_layout.cjs
      - name: Personal skill installer
        run: ./tests/test_install_skill.ps1
      - name: Build source archive
        run: python scripts/package.py
